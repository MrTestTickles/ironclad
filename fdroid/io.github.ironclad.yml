AutoName: Ironclad
Summary: Autonomous adult content blocker with 24-hour hardware quarantine

Description: |-
  Ironclad is an autonomous adult content blocker for Android built out of
  frustration with blockers that allow easy bypasses. Traditional apps rely
  on passwords you know or invasive partners that only report after a relapse.
  Ironclad enforces true self accountability by eliminating all instant escape
  routes through an unskippable 24 hour hardware lock.

  Features:

  * Blocks over 1.2 million adult domains via a local DNS sinkhole VPN
  * Drops encrypted DNS bypass attempts (DoH port 443, DoT port 853)
  * Enforces SafeSearch on Google, Bing, DuckDuckGo, and YouTube
  * Prevents uninstallation via Android Device Owner (Enterprise)
  * Locks deactivation behind a 24-hour monotonic hardware timer
  * Requires a 120-character zero-backspace typing test to unlock
  * Zero telemetry, zero ads, zero external servers

  Note: Virus scanners may flag this app because it uses Device Admin,
  Accessibility Service, and VPN permissions — the same APIs misused by
  malware. Here they are used solely for self-accountability content
  filtering. The code is fully open source.

